<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Logo Yadetout</title>
  <desc id="description">Courbe de marché ascendante cyan, violette et orange sur fond bleu nuit.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07101b"/>
      <stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <linearGradient id="trend" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#37d8ff"/>
      <stop offset="0.55" stop-color="#9d75ff"/>
      <stop offset="1" stop-color="#ffad55"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#background)" stroke="#31506f" stroke-width="16"/>
  <path d="M92 354 196 218 276 290 420 104" fill="none" stroke="url(#trend)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="420" cy="104" r="24" fill="#ffad55"/>
